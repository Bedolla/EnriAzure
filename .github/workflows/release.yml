name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, publish, and create release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release identity and version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PACKAGE="@bedolla/enriazure"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "${PACKAGE_NAME}" != "${EXPECTED_PACKAGE}" ]]; then
            echo "::error::Expected package ${EXPECTED_PACKAGE}, found ${PACKAGE_NAME}."
            exit 1
          fi

          if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists in npm."
            exit 1
          fi

      - name: Run complete validation
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
          npm run build

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish public package to npm
        run: npm publish --access public --tag latest --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
